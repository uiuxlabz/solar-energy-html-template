<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <defs>
    <linearGradient id="abtGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="350" fill="url(#abtGrad)" rx="12"/>
  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#FBBF24" opacity="0.6"/>
  <circle cx="150" cy="30" r="1" fill="#FBBF24" opacity="0.4"/>
  <circle cx="280" cy="50" r="1.5" fill="#FBBF24" opacity="0.5"/>
  <circle cx="350" cy="80" r="1" fill="#FBBF24" opacity="0.3"/>
  <circle cx="80" cy="90" r="1" fill="#FBBF24" opacity="0.4"/>
  <circle cx="320" cy="30" r="1.5" fill="#FBBF24" opacity="0.5"/>
  <!-- Sun rising behind horizon -->
  <clipPath id="horizon">
    <rect x="0" y="180" width="400" height="170"/>
  </clipPath>
  <circle cx="200" cy="180" r="70" fill="#D97706" clip-path="url(#horizon)" opacity="0.8"/>
  <circle cx="200" cy="180" r="50" fill="#F59E0B" clip-path="url(#horizon)"/>
  <!-- Horizon glow -->
  <rect x="0" y="175" width="400" height="8" fill="#D97706" opacity="0.3"/>
  <!-- Solar panels silhouette -->
  <rect x="40" y="220" width="80" height="50" rx="3" fill="#0F172A" opacity="0.8" transform="rotate(-5 80 245)"/>
  <rect x="140" y="215" width="80" height="50" rx="3" fill="#0F172A" opacity="0.8" transform="rotate(-5 180 240)"/>
  <rect x="240" y="220" width="80" height="50" rx="3" fill="#0F172A" opacity="0.8" transform="rotate(-5 280 245)"/>
  <!-- Ground -->
  <rect x="0" y="280" width="400" height="70" fill="#0F172A" opacity="0.5"/>
  <!-- Company name -->
  <text x="200" y="310" text-anchor="middle" fill="#FBBF24" font-size="18" font-family="sans-serif" font-weight="700" letter-spacing="4">SOLARIS</text>
  <text x="200" y="332" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif" letter-spacing="2">POWERING TOMORROW WITH THE SUN</text>
</svg>