<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Panel frame -->
  <rect x="60" y="100" width="280" height="200" rx="8" fill="url(#panelGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Grid lines -->
  <line x1="130" y1="100" x2="130" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="200" y1="100" x2="200" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="270" y1="100" x2="270" y2="300" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="167" x2="340" y2="167" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="233" x2="340" y2="233" stroke="#334155" stroke-width="1.5"/>
  <!-- Solar cells -->
  <rect x="68" y="108" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="138" y="108" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="208" y="108" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="278" y="108" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="68" y="175" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="138" y="175" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="208" y="175" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="278" y="175" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="68" y="242" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="138" y="242" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="208" y="242" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <rect x="278" y="242" width="56" height="52" rx="2" fill="url(#cellGrad)" opacity="0.8"/>
  <!-- Light reflection -->
  <rect x="68" y="108" width="56" height="52" rx="2" fill="white" opacity="0.1"/>
  <!-- Support leg -->
  <rect x="185" y="300" width="30" height="60" rx="4" fill="#475569"/>
  <rect x="155" y="350" width="90" height="12" rx="6" fill="#475569"/>
  <!-- Sun rays hitting panel -->
  <circle cx="80" cy="60" r="20" fill="#FBBF24" opacity="0.3"/>
  <line x1="80" y1="60" x2="120" y2="120" stroke="#FBBF24" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="60" x2="180" y2="110" stroke="#FBBF24" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="60" x2="100" y2="140" stroke="#FBBF24" stroke-width="1" opacity="0.35"/>
</svg>