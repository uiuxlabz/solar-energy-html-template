<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <!-- Background -->
  <rect width="400" height="350" fill="#F8FAFC" rx="12"/>
  <!-- Ground -->
  <rect x="0" y="280" width="400" height="70" fill="#E2E8F0"/>
  <!-- Solar panel -->
  <rect x="60" y="140" width="180" height="120" rx="6" fill="#1E3A5F" stroke="#334155" stroke-width="2"/>
  <!-- Panel grid -->
  <line x1="120" y1="140" x2="120" y2="260" stroke="#334155" stroke-width="1"/>
  <line x1="180" y1="140" x2="180" y2="260" stroke="#334155" stroke-width="1"/>
  <line x1="60" y1="180" x2="240" y2="180" stroke="#334155" stroke-width="1"/>
  <line x1="60" y1="220" x2="240" y2="220" stroke="#334155" stroke-width="1"/>
  <!-- Cells -->
  <rect x="68" y="148" width="44" height="24" rx="1" fill="#2563EB" opacity="0.7"/>
  <rect x="128" y="148" width="44" height="24" rx="1" fill="#2563EB" opacity="0.7"/>
  <rect x="188" y="148" width="44" height="24" rx="1" fill="#2563EB" opacity="0.7"/>
  <rect x="68" y="188" width="44" height="24" rx="1" fill="#2563EB" opacity="0.7"/>
  <rect x="128" y="188" width="44" height="24" rx="1" fill="#2563EB" opacity="0.7"/>
  <rect x="188" y="188" width="44" height="24" rx="1" fill="#2563EB" opacity="0.7"/>
  <!-- Support -->
  <rect x="145" y="260" width="10" height="30" fill="#475569"/>
  <!-- Worker figure -->
  <circle cx="310" cy="180" r="15" fill="#D97706"/>
  <rect x="300" y="195" width="20" height="40" rx="4" fill="#1E293B"/>
  <rect x="295" y="200" width="8" height="30" rx="3" fill="#1E293B"/>
  <rect x="327" y="200" width="8" height="30" rx="3" fill="#1E293B"/>
  <!-- Tool in hand (wrench) -->
  <line x1="327" y1="210" x2="345" y2="195" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <circle cx="348" cy="192" r="5" fill="none" stroke="#64748B" stroke-width="2"/>
  <!-- Hard hat -->
  <path d="M298,178 Q310,165 322,178" fill="#D97706" stroke="#B45309" stroke-width="1"/>
  <!-- Checkmark on panel -->
  <path d="M100,200 L110,210 L125,195" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Status indicators -->
  <circle cx="280" cy="250" r="8" fill="#10B981"/>
  <text x="280" y="254" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">&#10003;</text>
</svg>