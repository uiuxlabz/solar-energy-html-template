<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <!-- Background -->
  <rect width="400" height="350" fill="#F8FAFC" rx="12"/>
  <!-- Chart area -->
  <rect x="50" y="40" width="300" height="250" fill="white" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="80" y1="80" x2="320" y2="80" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="80" y1="120" x2="320" y2="120" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="80" y1="160" x2="320" y2="160" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="80" y1="200" x2="320" y2="200" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="80" y1="240" x2="320" y2="240" stroke="#F1F5F9" stroke-width="1"/>
  <!-- Y axis labels -->
  <text x="70" y="84" text-anchor="end" fill="#94A3B8" font-size="9" font-family="sans-serif">$0</text>
  <text x="70" y="124" text-anchor="end" fill="#94A3B8" font-size="9" font-family="sans-serif">$500</text>
  <text x="70" y="164" text-anchor="end" fill="#94A3B8" font-size="9" font-family="sans-serif">$1K</text>
  <text x="70" y="204" text-anchor="end" fill="#94A3B8" font-size="9" font-family="sans-serif">$1.5K</text>
  <text x="70" y="244" text-anchor="end" fill="#94A3B8" font-size="9" font-family="sans-serif">$2K</text>
  <!-- Savings bars -->
  <rect x="95" y="200" width="25" height="40" rx="3" fill="#CBD5E1"/>
  <rect x="130" y="170" width="25" height="70" rx="3" fill="#CBD5E1"/>
  <rect x="165" y="140" width="25" height="100" rx="3" fill="#94A3B8"/>
  <rect x="200" y="110" width="25" height="130" rx="3" fill="#D97706"/>
  <rect x="235" y="90" width="25" height="150" rx="3" fill="#D97706"/>
  <rect x="270" y="70" width="25" height="170" rx="3" fill="#1E293B"/>
  <!-- Trend line -->
  <polyline points="108,200 143,170 178,140 213,110 248,90 283,70" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend dots -->
  <circle cx="108" cy="200" r="4" fill="#D97706"/>
  <circle cx="143" cy="170" r="4" fill="#D97706"/>
  <circle cx="178" cy="140" r="4" fill="#D97706"/>
  <circle cx="213" cy="110" r="4" fill="#D97706"/>
  <circle cx="248" cy="90" r="4" fill="#D97706"/>
  <circle cx="283" cy="70" r="4" fill="#1E293B"/>
  <!-- X axis labels -->
  <text x="108" y="260" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif">Jan</text>
  <text x="143" y="260" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif">Mar</text>
  <text x="178" y="260" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif">May</text>
  <text x="213" y="260" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif">Jul</text>
  <text x="248" y="260" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif">Sep</text>
  <text x="283" y="260" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif">Nov</text>
  <!-- Dollar sign -->
  <text x="200" y="315" text-anchor="middle" fill="#1E293B" font-size="14" font-family="sans-serif" font-weight="700">ANNUAL SAVINGS GROWTH</text>
</svg>