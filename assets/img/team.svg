<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <!-- Background -->
  <rect width="400" height="350" fill="#F8FAFC" rx="12"/>
  <!-- Team member 1 -->
  <circle cx="120" cy="150" r="35" fill="#D97706"/>
  <circle cx="120" cy="140" r="12" fill="#FDE68A"/>
  <path d="M95,165 Q120,185 145,165" fill="#FDE68A"/>
  <!-- Team member 2 -->
  <circle cx="200" cy="150" r="35" fill="#1E293B"/>
  <circle cx="200" cy="140" r="12" fill="#CBD5E1"/>
  <path d="M175,165 Q200,185 225,165" fill="#CBD5E1"/>
  <!-- Team member 3 -->
  <circle cx="280" cy="150" r="35" fill="#2563EB"/>
  <circle cx="280" cy="140" r="12" fill="#BFDBFE"/>
  <path d="M255,165 Q280,185 305,165" fill="#BFDBFE"/>
  <!-- Collaboration lines -->
  <line x1="150" y1="150" x2="170" y2="150" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="230" y1="150" x2="250" y2="150" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Speech bubbles -->
  <rect x="80" y="200" width="80" height="30" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <polygon points="120,230 115,240 125,230" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="120" y="220" text-anchor="middle" fill="#64748B" font-size="8" font-family="sans-serif">Innovation</text>
  <rect x="240" y="200" width="80" height="30" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <polygon points="280,230 275,240 285,230" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="280" y="220" text-anchor="middle" fill="#64748B" font-size="8" font-family="sans-serif">Excellence</text>
  <!-- Sparkles -->
  <circle cx="155" cy="100" r="3" fill="#FBBF24"/>
  <circle cx="245" cy="100" r="3" fill="#FBBF24"/>
  <circle cx="200" cy="95" r="4" fill="#FBBF24"/>
  <!-- Title -->
  <text x="200" y="300" text-anchor="middle" fill="#1E293B" font-size="12" font-family="sans-serif" font-weight="700">OUR TEAM</text>
  <text x="200" y="318" text-anchor="middle" fill="#64748B" font-size="9" font-family="sans-serif">Experts in Solar Energy</text>
</svg>