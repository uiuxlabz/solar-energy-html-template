<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#ctaGrad)" rx="12"/>
  <!-- Decorative sun rays -->
  <g opacity="0.08" stroke="#D97706" stroke-width="1">
    <line x1="50" y1="20" x2="80" y2="50"/>
    <line x1="50" y1="50" x2="80" y2="80"/>
    <line x1="20" y1="50" x2="50" y2="80"/>
    <line x1="350" y1="150" x2="380" y2="180"/>
    <line x1="320" y1="150" x2="350" y2="180"/>
    <line x1="350" y1="120" x2="380" y2="150"/>
  </g>
  <!-- Large sun circle -->
  <circle cx="200" cy="100" r="80" fill="#D97706" opacity="0.06"/>
  <circle cx="200" cy="100" r="50" fill="#D97706" opacity="0.04"/>
  <!-- Bolt -->
  <polygon points="210,50 185,100 205,100 190,150 225,90 205,90 220,50" fill="#FBBF24" opacity="0.3"/>
</svg>