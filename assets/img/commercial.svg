<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <defs>
    <linearGradient id="bldgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="350" fill="#F0F9FF" rx="12"/>
  <!-- Sun -->
  <circle cx="60" cy="50" r="25" fill="#FBBF24" opacity="0.5"/>
  <!-- Ground -->
  <rect x="0" y="280" width="400" height="70" fill="#E2E8F0" rx="0"/>
  <!-- Building -->
  <rect x="100" y="100" width="120" height="180" fill="url(#bldgGrad)" rx="4"/>
  <!-- Windows -->
  <rect x="115" y="115" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="145" y="115" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="175" y="115" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="115" y="150" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="145" y="150" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="175" y="150" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="115" y="185" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="145" y="185" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <rect x="175" y="185" width="20" height="20" rx="2" fill="#BAE6FD"/>
  <!-- Door -->
  <rect x="145" y="240" width="30" height="40" rx="3" fill="#D97706"/>
  <!-- Roof solar panels -->
  <rect x="100" y="85" width="120" height="18" rx="2" fill="#1E3A5F" stroke="#334155" stroke-width="1"/>
  <line x1="130" y1="85" x2="130" y2="103" stroke="#475569" stroke-width="0.5"/>
  <line x1="160" y1="85" x2="160" y2="103" stroke="#475569" stroke-width="0.5"/>
  <line x1="190" y1="85" x2="190" y2="103" stroke="#475569" stroke-width="0.5"/>
  <!-- Second building -->
  <rect x="240" y="150" width="100" height="130" fill="#475569" rx="3"/>
  <rect x="255" y="165" width="16" height="16" rx="1" fill="#BAE6FD"/>
  <rect x="278" y="165" width="16" height="16" rx="1" fill="#BAE6FD"/>
  <rect x="301" y="165" width="16" height="16" rx="1" fill="#BAE6FD"/>
  <rect x="255" y="195" width="16" height="16" rx="1" fill="#BAE6FD"/>
  <rect x="278" y="195" width="16" height="16" rx="1" fill="#BAE6FD"/>
  <rect x="301" y="195" width="16" height="16" rx="1" fill="#BAE6FD"/>
  <rect x="275" y="240" width="30" height="40" rx="3" fill="#D97706"/>
  <!-- Roof solar panels on second building -->
  <rect x="240" y="138" width="100" height="14" rx="2" fill="#1E3A5F"/>
  <line x1="270" y1="138" x2="270" y2="152" stroke="#475569" stroke-width="0.5"/>
  <line x1="300" y1="138" x2="300" y2="152" stroke="#475569" stroke-width="0.5"/>
  <!-- Power lines -->
  <line x1="220" y1="120" x2="240" y2="150" stroke="#64748B" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Tree -->
  <circle cx="50" cy="230" r="22" fill="#34D399" opacity="0.6"/>
  <rect x="47" y="242" width="6" height="38" fill="#78350F"/>
</svg>