<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <!-- Background -->
  <rect width="400" height="350" fill="#F8FAFC" rx="12"/>
  <!-- Battery body -->
  <rect x="130" y="80" width="140" height="200" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <!-- Battery cap -->
  <rect x="170" y="65" width="60" height="18" rx="6" fill="#334155"/>
  <!-- Charge level -->
  <rect x="145" y="100" width="110" height="140" rx="6" fill="#D97706"/>
  <!-- Lightning bolt -->
  <polygon points="210,120 185,180 205,180 190,240 225,165 205,165 220,120" fill="#FBBF24"/>
  <!-- Status indicators -->
  <circle cx="175" cy="280" r="5" fill="#10B981"/>
  <text x="185" y="284" fill="#94A3B8" font-size="9" font-family="sans-serif">FULL</text>
  <!-- Energy flow arrows -->
  <path d="M80,180 L120,180" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M280,180 L320,180" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Home icon left -->
  <rect x="40" y="150" width="30" height="25" rx="2" fill="#475569"/>
  <polygon points="35,150 55,130 75,150" fill="#475569"/>
  <!-- Grid icon right -->
  <rect x="325" y="150" width="30" height="25" rx="2" fill="#475569"/>
  <line x1="325" y1="162" x2="355" y2="162" stroke="#64748B" stroke-width="1"/>
  <line x1="340" y1="150" x2="340" y2="175" stroke="#64748B" stroke-width="1"/>
  <!-- Label -->
  <text x="200" y="320" text-anchor="middle" fill="#64748B" font-size="11" font-family="sans-serif" font-weight="600">ENERGY STORAGE</text>
</svg>