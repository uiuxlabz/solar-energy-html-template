<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <!-- Background -->
  <rect width="400" height="350" fill="#FFF7ED" rx="12"/>
  <!-- Large sun -->
  <circle cx="200" cy="120" r="60" fill="#FBBF24" opacity="0.3"/>
  <circle cx="200" cy="120" r="40" fill="#F59E0B"/>
  <!-- Rays -->
  <g stroke="#D97706" stroke-width="2.5" stroke-linecap="round">
    <line x1="200" y1="55" x2="200" y2="35"/>
    <line x1="200" y1="185" x2="200" y2="205"/>
    <line x1="135" y1="120" x2="115" y2="120"/>
    <line x1="265" y1="120" x2="285" y2="120"/>
    <line x1="154" y1="74" x2="140" y2="60"/>
    <line x1="246" y1="74" x2="260" y2="60"/>
    <line x1="154" y1="166" x2="140" y2="180"/>
    <line x1="246" y1="166" x2="260" y2="180"/>
  </g>
  <!-- Three benefit cards -->
  <rect x="30" y="220" width="100" height="100" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="80" cy="245" r="12" fill="#10B981" opacity="0.15"/>
  <text x="80" y="250" text-anchor="middle" fill="#10B981" font-size="16" font-family="sans-serif">&#10003;</text>
  <text x="80" y="272" text-anchor="middle" fill="#1E293B" font-size="9" font-family="sans-serif" font-weight="600">CLEAN</text>
  <text x="80" y="284" text-anchor="middle" fill="#64748B" font-size="8" font-family="sans-serif">Energy</text>
  <rect x="150" y="220" width="100" height="100" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="200" cy="245" r="12" fill="#D97706" opacity="0.15"/>
  <text x="200" y="250" text-anchor="middle" fill="#D97706" font-size="16" font-family="sans-serif">$</text>
  <text x="200" y="272" text-anchor="middle" fill="#1E293B" font-size="9" font-family="sans-serif" font-weight="600">SAVINGS</text>
  <text x="200" y="284" text-anchor="middle" fill="#64748B" font-size="8" font-family="sans-serif">Lower Bills</text>
  <rect x="270" y="220" width="100" height="100" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="320" cy="245" r="12" fill="#2563EB" opacity="0.15"/>
  <text x="320" y="250" text-anchor="middle" fill="#2563EB" font-size="16" font-family="sans-serif">&#9889;</text>
  <text x="320" y="272" text-anchor="middle" fill="#1E293B" font-size="9" font-family="sans-serif" font-weight="600">POWER</text>
  <text x="320" y="284" text-anchor="middle" fill="#64748B" font-size="8" font-family="sans-serif">Independence</text>
</svg>